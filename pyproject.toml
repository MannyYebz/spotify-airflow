[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-listening-analytics"
version = "0.2.0"
description = "Spotify extraction and analytics datasets orchestrated with Airflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "pandas>=2.1,<3",
    "pyarrow>=18,<23",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.9,<4", "numpy>=1.26,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
